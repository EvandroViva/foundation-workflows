name: Product Deploy Services (reusable)

on:
  workflow_call:
    inputs:
      package-scope:
        description: 'pnpm workspace scope of the calling product (e.g. @betting-pool)'
        required: true
        type: string
      image-name:
        description: 'GHCR image name / EC2 project directory name (e.g. chutai)'
        required: true
        type: string
      container-prefix:
        description: 'Base name of the API container (e.g. bp-api); "-sandbox" is appended for the sandbox environment'
        required: true
        type: string
      enable-datadog:
        description: 'Whether the host runs a Datadog agent container to keep up during production deploys'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Target environment'
        required: true
        type: string
      deploy_api:
        required: false
        type: boolean
        default: true
      deploy_web:
        required: false
        type: boolean
        default: true
      deploy_admin:
        required: false
        type: boolean
        default: true
      deploy_workers:
        required: false
        type: boolean
        default: true
      backup:
        required: false
        type: boolean
        default: false
      runner:
        description: 'Where jobs run: cloud (GitHub-hosted: ubuntu-latest, or ubuntu-24.04-arm for the Docker build) or self-hosted (self-hosted/Linux/ARM64, the Raspberry Pi runners)'
        required: false
        type: string
        default: cloud
      zero-downtime:
        description: >-
          Opt-in zero-downtime rollout. Requires the product's compose files to (1) not pin
          container_name on api/web/admin/workers, (2) route traffic through a health-aware
          proxy (e.g. Traefik), (3) define a one-shot `migrate` service (api image, profile
          `migrate`) and (4) not run migrations on API boot. Migrations must be expand-only:
          old and new code run side by side against the new schema during the rollout.
        required: false
        type: boolean
        default: false
      rollout-settle-seconds:
        description: 'zero-downtime only: seconds to wait after the new replicas are healthy before draining the old ones, so the proxy has loaded them (Traefik batches Docker events every 2s by default)'
        required: false
        type: number
        default: 5
      edge-services:
        description: 'zero-downtime only: space-separated always-on edge services (e.g. "traefik cloudflared") brought up (created/updated only when their config changed) before the rollout'
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-${{ inputs.image-name }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── Lint & Test ───────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: EvandroViva/foundation-workflows/.github/actions/setup-node-pnpm@main
        with:
          node-auth-token: ${{ secrets.GHCR_PAT }}

      - name: Build shared packages
        run: pnpm --filter ${{ inputs.package-scope }}/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter ${{ inputs.package-scope }}/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ── Prepare Build Matrix ──────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Build service matrix
        id: matrix
        run: |
          SERVICES="[]"
          if [[ "${{ inputs.deploy_api }}" == "true" ]]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["api"]')
          fi
          if [[ "${{ inputs.deploy_workers }}" == "true" ]]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["workers"]')
          fi
          if [[ "${{ inputs.deploy_web }}" == "true" ]]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["web"]')
          fi
          if [[ "${{ inputs.deploy_admin }}" == "true" ]]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["admin"]')
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Selected services: $SERVICES"

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${{ inputs.environment }}-${SHORT_SHA}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_PREFIX="ghcr.io/${OWNER}/${{ inputs.image-name }}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$IMAGE_PREFIX" >> "$GITHUB_OUTPUT"

  # ── Build & Push Docker Images ────────────────────────────
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","Linux","ARM64"]') || 'ubuntu-24.04-arm' }}
    needs: [lint-and-test, prepare]
    if: needs.prepare.outputs.services != '[]'
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build secrets
        run: |
          # grep -v exits 1 when no lines match; pipefail would abort the step.
          # Write filtered output or an empty file if all content is filtered/secret is unset.
          { printf '%s\n' "$WEB_ENV" | grep -v '^#' | grep -v '^$' || true; } > /tmp/web.env
          { printf '%s\n' "$ADMIN_ENV" | grep -v '^#' | grep -v '^$' || true; } > /tmp/admin.env
          # Compute hashes so the Dockerfile ARG changes whenever the env content changes,
          # busting the Docker layer cache for the `next build` step automatically.
          echo "WEB_ENV_HASH=$(md5sum /tmp/web.env | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "ADMIN_ENV_HASH=$(md5sum /tmp/admin.env | cut -d' ' -f1)" >> "$GITHUB_ENV"
        env:
          WEB_ENV: ${{ secrets.WEB_ENV }}
          ADMIN_ENV: ${{ secrets.ADMIN_ENV }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.image_prefix }}/${{ matrix.service }}:${{ inputs.environment }}-latest
          # NEXT_PUBLIC_* env vars for Next.js apps (web, admin) are injected via BuildKit secrets.
          # Each GitHub Environment (production/sandbox) must have WEB_ENV and ADMIN_ENV secrets
          # containing the full .env file contents. API/Workers Dockerfiles ignore these secrets.
          # WEB_ENV_HASH / ADMIN_ENV_HASH bust the layer cache whenever the env file changes.
          build-args: |
            WEB_ENV_HASH=${{ env.WEB_ENV_HASH }}
            ADMIN_ENV_HASH=${{ env.ADMIN_ENV_HASH }}
          secrets: |
            node_auth_token=${{ secrets.GHCR_PAT }}
          secret-files: |
            web_env=/tmp/web.env
            admin_env=/tmp/admin.env
          # Self-hosted ARM64 runners use a host-mounted local cache dir (see docker-runner's
          # docker-compose-raspberry.yml) instead of the gha backend: it's shared across all
          # self-hosted containers for this product regardless of which one lands the job, has
          # no 10GB/eviction limit, and doesn't race with the other concurrent matrix builds
          # over the network the way type=gha did (caused "blob sha256:...: not found" errors).
          cache-from: ${{ inputs.runner == 'self-hosted' && format('type=local,src=/buildx-cache/{0}-{1}', matrix.service, inputs.environment) || format('type=gha,scope={0}-{1}', matrix.service, inputs.environment) }}
          cache-to: ${{ inputs.runner == 'self-hosted' && format('type=local,dest=/buildx-cache/{0}-{1},mode=max', matrix.service, inputs.environment) || format('type=gha,mode=max,scope={0}-{1}', matrix.service, inputs.environment) }}

  # ── Deploy to EC2 ─────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    needs: [prepare, build-and-push]
    # Binds sandbox/production Environment secrets (EC2_HOST/EC2_USER/EC2_SSH_KEY,
    # TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET) — falls back to repo-level secrets of the
    # same name when an Environment doesn't override them. Production now sets its
    # own EC2_HOST (Tailscale IP) and TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET at the
    # Environment level; EC2_USER/EC2_SSH_KEY are unchanged and still fall back to
    # the repo-level secrets (same SSH key/user, only the network path changed).
    environment: ${{ inputs.environment }}
    steps:
      - name: Build service list
        id: services
        run: |
          SERVICES=""
          if [[ "${{ inputs.deploy_api }}" == "true" ]]; then SERVICES="$SERVICES api"; fi
          if [[ "${{ inputs.deploy_workers }}" == "true" ]]; then SERVICES="$SERVICES workers"; fi
          if [[ "${{ inputs.deploy_web }}" == "true" ]]; then SERVICES="$SERVICES web"; fi
          if [[ "${{ inputs.deploy_admin }}" == "true" ]]; then SERVICES="$SERVICES admin"; fi
          echo "list=$(echo $SERVICES | xargs)" >> "$GITHUB_OUTPUT"

      # Sandbox's EC2_HOST is the Raspberry Pi, which only has a private LAN address,
      # and production's EC2_HOST is now this same shared VPS's Tailscale IP too (its
      # public IP is being phased out as the normal access path — see workspace
      # AGENTS.md's "Production VPS (EC2)" section). Either way a GitHub-hosted runner
      # can't reach a Tailscale-only address directly, so join the tailnet first here.
      # Production uses a separate OAuth client/tag (tag:server) from sandbox's tag:ci,
      # each scoped to its own environment's TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET secrets.
      # Skipped when runner == self-hosted: those runners already run as containers on
      # the Pi itself (no tunnel needed to reach it), and they only have docker.sock
      # mounted — no /dev/net/tun, so tailscaled couldn't even bring up an interface there.
      - name: Connect to Tailscale
        if: (inputs.environment == 'sandbox' || inputs.environment == 'production') && inputs.runner != 'self-hosted'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.environment == 'production' && 'tag:server' || 'tag:ci' }}
          # `tailscale up` failures (e.g. 400 "requested tags are invalid or not permitted")
          # don't fail this action on their own — it would exit 0 and the deploy would die
          # later with an opaque SSH timeout. Pinging the deploy target fails this step instead.
          targets: ${{ secrets.EC2_HOST }}

      # Native ssh instead of a Docker-based action: appleboy/ssh-action runs as a
      # sibling container with its own network namespace, so it can't see the
      # tailscale0 route the previous step configured on the runner host — it only
      # works for publicly routable hosts (production's EC2). A plain `run:` step
      # executes directly in the runner's own process/network namespace, so it can
      # reach the sandbox host's Tailscale IP too. Same remote script either way.
      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          GHCR_IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_ENV: ${{ inputs.environment }}
          SERVICES: ${{ steps.services.outputs.list }}
          DO_BACKUP: ${{ inputs.backup }}
          DEPLOY_API: ${{ inputs.deploy_api }}
          PROJECT_DIR_NAME: ${{ inputs.image-name }}
          API_CONTAINER_PREFIX: ${{ inputs.container-prefix }}
          ENABLE_DATADOG: ${{ inputs.enable-datadog }}
          # Datadog release tag — the image tag (env-shortsha) so Datadog tracks
          # deploys/regressions per release. Only meaningful when ENABLE_DATADOG=true.
          DD_VERSION: ${{ needs.prepare.outputs.image_tag }}
          ZERO_DOWNTIME: ${{ inputs.zero-downtime }}
          # Commit whose images build-and-push just built (prepare tags images with it).
          DEPLOY_SHA: ${{ github.sha }}
          EDGE_SERVICES: ${{ inputs.edge-services }}
          ROLLOUT_SETTLE_SECONDS: ${{ inputs.rollout-settle-seconds }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          {
            # First block: substituted locally (these are single-line, GH-Actions-sourced
            # values) into literal `export` lines the remote shell will see.
            cat <<ENVBLOCK
          export IMAGE_TAG="$IMAGE_TAG"
          export GHCR_IMAGE_PREFIX="$GHCR_IMAGE_PREFIX"
          export GHCR_TOKEN="$GHCR_TOKEN"
          export GHCR_USER="$GHCR_USER"
          export DEPLOY_ENV="$DEPLOY_ENV"
          export SERVICES="$SERVICES"
          export DO_BACKUP="$DO_BACKUP"
          export DEPLOY_API="$DEPLOY_API"
          export PROJECT_DIR_NAME="$PROJECT_DIR_NAME"
          export API_CONTAINER_PREFIX="$API_CONTAINER_PREFIX"
          export ENABLE_DATADOG="$ENABLE_DATADOG"
          export DD_VERSION="$DD_VERSION"
          export ZERO_DOWNTIME="$ZERO_DOWNTIME"
          export DEPLOY_SHA="$DEPLOY_SHA"
          export EDGE_SERVICES="$EDGE_SERVICES"
          export ROLLOUT_SETTLE_SECONDS="$ROLLOUT_SETTLE_SECONDS"
          ENVBLOCK
            # Second block: quoted heredoc, sent verbatim — every $VAR here is meant to
            # be evaluated on the remote host, not by this local shell.
            cat <<'SCRIPTBODY'
          set -euo pipefail

          PROJECT_DIR="$HOME/$PROJECT_DIR_NAME"
          cd "$PROJECT_DIR"

          echo "=== Deploy Started ==="
          echo "Environment: $DEPLOY_ENV"
          echo "Services:    $SERVICES"
          echo "Image tag:   $IMAGE_TAG"
          echo ""

          # ── Check out the deployed commit (compose files, migrations, env templates) ──
          # Same commit the images were built from, so config and images always match —
          # also when deploying a branch (previously the host always pulled main, mixing
          # branch images with main's compose files). The host ends on a detached HEAD;
          # works with the shallow (--depth 1) checkouts used on deploy hosts.
          echo "--- Checking out $DEPLOY_SHA ---"
          git fetch --depth 1 origin "$DEPLOY_SHA"
          git checkout --detach FETCH_HEAD
          git log -1 --format='Deployed commit: %h %s'

          # ── Optional backup ──
          if [[ "$DO_BACKUP" == "true" ]]; then
            echo "--- Running pre-deploy backup ---"
            if [[ "$DEPLOY_ENV" == "production" ]]; then
              make backup
            else
              make backup-sandbox
            fi
          fi

          # ── Login to GHCR ──
          echo "--- Logging in to GHCR ---"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # ── Set compose command based on environment ──
          if [[ "$DEPLOY_ENV" == "production" ]]; then
            DC="docker compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.production.yml -p ${PROJECT_DIR_NAME}-production"
            API_CONTAINER="$API_CONTAINER_PREFIX"
          else
            DC="docker compose -f infrastructure/docker/docker-compose.sandbox.yml -p ${PROJECT_DIR_NAME}-sandbox"
            API_CONTAINER="${API_CONTAINER_PREFIX}-sandbox"
          fi

          # ── Export env vars for compose interpolation ──
          export IMAGE_TAG="$IMAGE_TAG"
          export GHCR_IMAGE_PREFIX="$GHCR_IMAGE_PREFIX"
          # DD_VERSION tags the redeployed app containers for Datadog release tracking.
          # DD_API_KEY / DD_POSTGRES_PASSWORD are read from infrastructure/docker/.env on the host.
          export DD_VERSION="$DD_VERSION"

          # ── Pull images ──
          echo "--- Pulling images ---"
          $DC pull $SERVICES

          if [[ "$ZERO_DOWNTIME" == "true" ]]; then
            # ── Zero-downtime path ──
            # Prints "healthy" / "unhealthy" / "starting" for containers with a
            # healthcheck, or "running"/"exited"/... (plain state) for ones without.
            container_status() {
              docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$1" 2>/dev/null || echo missing
            }

            # Wait until every given container is healthy (or, without a healthcheck,
            # has stayed running for 15s). Returns 1 on timeout / crash.
            wait_ready() {
              local deadline=$((SECONDS + 180)) id st running_since
              for id in "$@"; do
                running_since=""
                while true; do
                  st="$(container_status "$id")"
                  case "$st" in
                    healthy) break ;;
                    running)
                      [[ -z "$running_since" ]] && running_since=$SECONDS
                      (( SECONDS - running_since >= 15 )) && break ;;
                    starting) ;;
                    *) echo "ERROR: container $id is '$st'"; return 1 ;;
                  esac
                  if (( SECONDS > deadline )); then
                    echo "ERROR: container $id not ready in time (last status: $st)"
                    return 1
                  fi
                  sleep 3
                done
                echo "Container $id ready ($st)"
              done
            }

            # Side-by-side rollout: start the new replicas next to the old ones, wait
            # for them to be ready (the proxy only routes to healthy containers), then
            # SIGTERM the old ones so they drain. On failure the new replicas are removed
            # and the old ones keep serving untouched.
            rollout() {
              local svc="$1" old new count
              old="$($DC ps -q "$svc" | sort)"
              count="$(printf '%s\n' "$old" | grep -c . || true)"
              if (( count == 0 )); then
                echo "--- $svc: no running replica, starting fresh ---"
                $DC up -d --no-build --no-deps "$svc"
                # shellcheck disable=SC2046
                wait_ready $($DC ps -q "$svc")
                return
              fi
              echo "--- $svc: starting $count new replica(s) next to $count old ---"
              $DC up -d --no-build --no-deps --no-recreate --scale "$svc=$((count * 2))" "$svc"
              new="$(comm -13 <(printf '%s\n' "$old") <($DC ps -q "$svc" | sort))"
              # shellcheck disable=SC2086
              if ! wait_ready $new; then
                echo "--- $svc: new replica(s) failed, rolling back ---"
                for id in $new; do docker logs --tail 50 "$id" || true; done
                # shellcheck disable=SC2086
                docker rm -f $new >/dev/null
                return 1
              fi
              # Docker-healthy isn't proxy-routable yet: Traefik picks the new replicas up
              # on its next config reload. Draining the old ones first left the service
              # with no server for ~1s on the sandbox (Traefik answered 503).
              echo "--- $svc: new replica(s) ready, waiting ${ROLLOUT_SETTLE_SECONDS}s for the proxy ---"
              sleep "$ROLLOUT_SETTLE_SECONDS"
              echo "--- $svc: draining old replica(s) ---"
              # shellcheck disable=SC2086
              docker stop -t 30 $old >/dev/null
              # shellcheck disable=SC2086
              docker rm $old >/dev/null
              echo "--- $svc: rollout complete ---"
            }

            if [[ -n "$EDGE_SERVICES" ]]; then
              echo "--- Ensuring edge services are up: $EDGE_SERVICES ---"
              # shellcheck disable=SC2086
              $DC up -d --no-build --no-deps $EDGE_SERVICES
            fi

            # Migrations run once, before any new code starts, from the API image of
            # this release. Expand-only migrations keep the still-running old release
            # working; a failure aborts the deploy with the old release untouched.
            if [[ "$DEPLOY_API" == "true" ]]; then
              echo "--- Running database migrations ---"
              $DC --profile migrate run --rm --no-deps migrate
            fi

            for svc in $SERVICES; do
              rollout "$svc"
            done
          else
            # ── Restart containers (--no-deps: don't touch dependency services) ──
            echo "--- Restarting containers ---"
            $DC up -d --no-build --no-deps --force-recreate $SERVICES
          fi

          # ── Ensure the Datadog agent is running (production only; repos without a Datadog
          # profile in their compose files leave ENABLE_DATADOG unset) ──
          if [[ "$DEPLOY_ENV" == "production" && "$ENABLE_DATADOG" == "true" ]]; then
            echo "--- Ensuring Datadog agent is up ---"
            $DC up -d --no-build --no-deps datadog-agent || echo "WARN: datadog-agent not started (check DD_API_KEY in host .env)"
          fi

          # ── Health check (if API was deployed) ──
          # (zero-downtime: rollout() already waited for every new replica to be healthy)
          if [[ "$DEPLOY_API" == "true" && "$ZERO_DOWNTIME" != "true" ]]; then
            echo "--- Waiting for API health check ---"
            HEALTHY=false
            for i in $(seq 1 10); do
              sleep 10
              if docker exec "$API_CONTAINER" wget --no-verbose --tries=1 --spider http://localhost:3001/api/v1/health 2>/dev/null; then
                echo "API is healthy (attempt $i)"
                HEALTHY=true
                break
              fi
              echo "Waiting for API... (attempt $i/10)"
            done
            if [[ "$HEALTHY" != "true" ]]; then
              echo "ERROR: API health check failed after 10 attempts"
              docker logs "$API_CONTAINER" --tail 50
              exit 1
            fi
          fi

          # ── Cleanup dangling images ──
          echo "--- Cleaning up ---"
          docker image prune -af

          echo ""
          echo "=== Deploy Complete ==="
          SCRIPTBODY
          } | ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" bash -s

  # ── Summary ───────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    needs: [prepare, build-and-push, deploy]
    if: always()
    steps:
      - name: Write job summary
        uses: actions/github-script@v7
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          DEPLOY_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          DEPLOY_API: ${{ inputs.deploy_api }}
          DEPLOY_WEB: ${{ inputs.deploy_web }}
          DEPLOY_ADMIN: ${{ inputs.deploy_admin }}
          DEPLOY_WORKERS: ${{ inputs.deploy_workers }}
          BACKUP: ${{ inputs.backup }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const name = process.env.IMAGE_NAME;
            const env = process.env.DEPLOY_ENV;
            const tag = process.env.IMAGE_TAG;
            const sha = process.env.SHORT_SHA;
            const backup = process.env.BACKUP === 'true' ? '✅' : '⏭️ Skipped';
            const buildResult = process.env.BUILD_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;

            const icon = (v) => v === 'true' ? '✅' : '⬜';
            const statusIcon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';

            const summary = `## Deploy Summary

            | | |
            |---|---|
            | **Environment** | \`${env}\` |
            | **Commit** | \`${sha}\` |
            | **Image tag** | \`${tag}\` |
            | **Backup** | ${backup} |

            ### Services

            | Service | Selected | Image |
            |---------|----------|-------|
            | API | ${icon(process.env.DEPLOY_API)} | \`${name}/api:${tag}\` |
            | Web | ${icon(process.env.DEPLOY_WEB)} | \`${name}/web:${tag}\` |
            | Admin | ${icon(process.env.DEPLOY_ADMIN)} | \`${name}/admin:${tag}\` |
            | Workers | ${icon(process.env.DEPLOY_WORKERS)} | \`${name}/workers:${tag}\` |

            ### Result

            | Stage | Status |
            |-------|--------|
            | Build & Push | ${statusIcon(buildResult)} ${buildResult} |
            | Deploy to EC2 | ${statusIcon(deployResult)} ${deployResult} |
            `;

            await core.summary.addRaw(summary).write();
